<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poeira — enviar arquivo</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot" id="dot"></span><span id="eyebrowText">conectando</span></div>
    <h1>enviar arquivo</h1>
    <div class="sub">Este arquivo vai direto para o computador que gerou o código. Nada fica salvo neste servidor.</div>

    <div class="stage" id="stage">
      <div class="center-msg" id="centerMsg">conectando à sala…</div>

      <div class="file-picker" id="filePicker" style="display:none">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
        <button type="button" id="pickFileBtn">escolher arquivo</button>
        <div class="file-picker-hint">imagem ou vídeo — vai direto pro computador</div>
      </div>

      <div class="transfer" id="transfer" style="display:none">
        <div class="transfer-name" id="transferName">—</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="transfer-pct" id="transferPct">0%</div>
      </div>
    </div>

    <div class="status-line">
      <span id="statusText">conectando</span>
    </div>

    <div class="footnote">o arquivo sai daqui direto pro computador, sem passar por servidor</div>
  </div>

<script type="module" src="/assets/room-page.js"></script>

</body>
</html>
