<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poeira — transferência efêmera</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot" id="dot"></span><span id="eyebrowText">criando sala</span></div>
    <h1>escaneie para conectar</h1>
    <div class="sub">Abra a câmera do celular e aponte para o código. O arquivo vai direto do celular para este computador, sem passar por servidor.</div>

    <div class="stage" id="stage">
      <div class="qr-wrap" id="qrWrap">
        <div class="qr" id="qrBox"></div>
        <div class="qr-label" id="qrLabel">gerando código…</div>
      </div>
    </div>

    <div class="meta">
      <span>sala <strong id="tokenLabel">—</strong></span>
      <span id="expiryLabel">expira em 10min</span>
    </div>

    <div class="status-line">
      <span id="statusText">aguardando conexão</span>
    </div>

    <div class="footnote">nenhum dado é salvo em servidor</div>
  </div>

<script type="module">
import { connectSignaling } from "/assets/signaling-client.js";

const dot = document.getElementById("dot");
const eyebrowText = document.getElementById("eyebrowText");
const qrBox = document.getElementById("qrBox");
const qrLabel = document.getElementById("qrLabel");
const tokenLabel = document.getElementById("tokenLabel");
const statusText = document.getElementById("statusText");

async function createRoom() {
  const res = await fetch("/api/rooms", { method: "POST" });
  if (!res.ok) {
    statusText.textContent = "falha ao criar sala — recarregue a página";
    dot.classList.add("off");
    return;
  }
  const room = await res.json();
  tokenLabel.textContent = room.token.slice(0, 8);

  const qrRes = await fetch(room.qrUrl);
  const svg = await qrRes.text();
  qrBox.innerHTML = svg;
  qrLabel.textContent = "aponte a câmera para conectar";
  eyebrowText.textContent = "aguardando celular";

  connectSignaling({
    token: room.token,
    role: "dest",
    onOpen: () => {
      statusText.textContent = "sala ativa — aguardando conexão";
    },
    onMessage: (msg) => {
      if (msg.type === "peer-status" && msg.status === "connected") {
        statusText.textContent = "celular conectado";
        eyebrowText.textContent = "conectado";
      }
      if (msg.type === "peer-status" && msg.status === "disconnected") {
        statusText.textContent = "celular desconectado";
        eyebrowText.textContent = "aguardando celular";
      }
      if (msg.type === "room-destroyed") {
        statusText.textContent = "sala encerrada";
        eyebrowText.textContent = "encerrada";
        dot.classList.add("off");
      }
    },
    onClose: () => {
      dot.classList.add("off");
    },
  });
}

createRoom();
</script>

</body>
</html>
