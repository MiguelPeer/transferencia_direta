<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poeira — transferência efêmera</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1c1b1a;
    --bg-raised: #232220;
    --bone: #edeae4;
    --bone-dim: #a8a49c;
    --dust: #5b7c99;
    --dust-dim: #3d5266;
    --line: #35332f;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 20px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(91,124,153,0.05), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(91,124,153,0.04), transparent 40%);
  }

  .card{
    width: 100%;
    max-width: 420px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 32px 28px;
    position: relative;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dust);
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--dust);
    box-shadow: 0 0 8px var(--dust);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  h1{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .sub{
    font-size: 13px;
    color: var(--bone-dim);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .stage{
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #141312;
    border: 1px solid var(--line);
    border-radius: 3px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow: hidden;
    margin-bottom: 22px;
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .qr-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    gap: 14px;
    transition: opacity 0.4s ease;
  }

  .qr{
    width: 148px;
    height: 148px;
    background: var(--bone);
    border-radius: 2px;
    padding: 10px;
  }

  .qr svg{ width:100%; height:100%; display:block; }

  .qr-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--bone-dim);
    text-transform: uppercase;
  }

  .meta{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone-dim);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .meta strong{
    color: var(--bone);
    font-weight: 500;
  }

  .status-line{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dust);
    margin-bottom: 22px;
  }

  .status-line .bar{
    flex:1;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }

  .status-line .bar::after{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width: 62%;
    background: var(--dust);
  }

  button{
    width:100%;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--dust-dim);
    color: var(--dust);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover{
    background: rgba(91,124,153,0.08);
    border-color: var(--dust);
  }

  button:active{ transform: scale(0.99); }

  button:disabled{
    opacity: 0.4;
    cursor: default;
  }

  .footnote{
    text-align:center;
    font-size: 11px;
    color: var(--bone-dim);
    margin-top: 16px;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span>conexão direta · sem servidor intermediário</div>
    <h1>retrato.jpg recebido</h1>
    <div class="sub">Transferido diretamente do dispositivo de origem. Qualidade e metadados originais preservados.</div>

    <div class="stage" id="stage">
      <div class="qr-wrap" id="qrWrap">
        <div class="qr">
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#EDEAE4"/>
            <g fill="#1C1B1A">
              <rect x="8" y="8" width="24" height="24"/>
              <rect x="14" y="14" width="12" height="12" fill="#EDEAE4"/>
              <rect x="18" y="18" width="4" height="4"/>
              <rect x="68" y="8" width="24" height="24"/>
              <rect x="74" y="14" width="12" height="12" fill="#EDEAE4"/>
              <rect x="78" y="18" width="4" height="4"/>
              <rect x="8" y="68" width="24" height="24"/>
              <rect x="14" y="74" width="12" height="12" fill="#EDEAE4"/>
              <rect x="18" y="78" width="4" height="4"/>
              <rect x="40" y="8" width="4" height="4"/><rect x="48" y="8" width="4" height="4"/>
              <rect x="40" y="16" width="4" height="4"/><rect x="56" y="16" width="4" height="4"/>
              <rect x="44" y="24" width="4" height="4"/><rect x="60" y="24" width="4" height="4"/>
              <rect x="40" y="40" width="4" height="4"/><rect x="48" y="40" width="4" height="4"/><rect x="56" y="40" width="4" height="4"/>
              <rect x="40" y="48" width="4" height="4"/><rect x="60" y="48" width="4" height="4"/>
              <rect x="48" y="56" width="4" height="4"/><rect x="64" y="56" width="4" height="4"/>
              <rect x="40" y="64" width="4" height="4"/><rect x="56" y="64" width="4" height="4"/>
              <rect x="68" y="40" width="4" height="4"/><rect x="76" y="40" width="4" height="4"/><rect x="84" y="40" width="4" height="4"/>
              <rect x="72" y="48" width="4" height="4"/><rect x="88" y="48" width="4" height="4"/>
              <rect x="68" y="56" width="4" height="4"/><rect x="80" y="56" width="4" height="4"/>
              <rect x="72" y="64" width="4" height="4"/><rect x="84" y="72" width="4" height="4"/>
              <rect x="68" y="80" width="4" height="4"/><rect x="76" y="84" width="4" height="4"/><rect x="88" y="88" width="4" height="4"/>
              <rect x="40" y="76" width="4" height="4"/><rect x="48" y="84" width="4" height="4"/><rect x="56" y="76" width="4" height="4"/>
            </g>
          </svg>
        </div>
        <div class="qr-label">aponte a câmera para conectar</div>
      </div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="meta">
      <span>origem <strong>iPhone de Miguel</strong></span>
      <span>4.2 MB</span>
    </div>

    <div class="status-line">
      <span id="statusText">1 de 3 downloads restantes</span>
      <span class="bar"></span>
    </div>

    <button id="destroyBtn">destruir agora</button>
    <div class="footnote">nenhum dado foi salvo em servidor</div>
  </div>

<script>
const stage = document.getElementById('stage');
const qrWrap = document.getElementById('qrWrap');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('destroyBtn');
const statusText = document.getElementById('statusText');

let dpr = window.devicePixelRatio || 1;
function resize(){
  const rect = stage.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

// draw a placeholder "photo" onto an offscreen canvas to source particles from
function buildPhotoData(w,h){
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const grad = octx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#3d5266');
  grad.addColorStop(0.5, '#5b7c99');
  grad.addColorStop(1, '#8fa8bb');
  octx.fillStyle = grad;
  octx.fillRect(0,0,w,h);
  octx.fillStyle = 'rgba(237,234,228,0.9)';
  octx.beginPath();
  octx.arc(w*0.5, h*0.42, Math.min(w,h)*0.16, 0, Math.PI*2);
  octx.fill();
  octx.beginPath();
  octx.ellipse(w*0.5, h*0.82, w*0.32, h*0.22, 0, Math.PI, 0);
  octx.fill();
  return octx.getImageData(0,0,w,h);
}

let particles = [];
let animating = false;

function initParticles(){
  const rect = stage.getBoundingClientRect();
  const w = Math.floor(rect.width);
  const h = Math.floor(rect.height);
  const step = 4;
  const imgData = buildPhotoData(w,h);
  particles = [];
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      const i = (y*w + x) * 4;
      const a = imgData.data[i+3];
      if(a < 40) continue;
      const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
      particles.push({
        x, y, ox:x, oy:y,
        r: r, g: g, b: b,
        size: step*0.9,
        vx: (Math.random()-0.5)*0.3,
        vy: -0.4 - Math.random()*0.6,
        life: 1,
        delay: (x / w) * 40 + Math.random()*10
      });
    }
  }
}

function drawStatic(){
  const rect = stage.getBoundingClientRect();
  const w = Math.floor(rect.width), h = Math.floor(rect.height);
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

let frame = 0;
function animate(){
  const rect = stage.getBoundingClientRect();
  const w = Math.floor(rect.width), h = Math.floor(rect.height);
  ctx.clearRect(0,0,w,h);
  frame++;
  let allDead = true;
  particles.forEach(p=>{
    if(frame < p.delay) { allDead = false; ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`; ctx.fillRect(p.x,p.y,p.size,p.size); return; }
    p.life -= 0.012;
    if(p.life <= 0) return;
    allDead = false;
    p.x += p.vx + Math.sin((frame+p.oy)*0.02)*0.3;
    p.y += p.vy;
    p.vy -= 0.006;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x, p.y, p.size*p.life, p.size*p.life);
    ctx.globalAlpha = 1;
  });
  if(!allDead){
    requestAnimationFrame(animate);
  } else {
    canvas.style.transition = 'opacity 0.6s ease';
    stage.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    setTimeout(()=>{
      stage.style.opacity = '0.3';
      statusText.textContent = 'arquivo descartado';
      btn.textContent = 'já foi destruído';
      btn.disabled = true;
    }, 150);
  }
}

btn.addEventListener('click', ()=>{
  if(animating) return;
  animating = true;
  qrWrap.style.display = 'none';
  btn.disabled = true;
  initParticles();
  drawStatic();
  requestAnimationFrame(()=>{
    frame = 0;
    animate();
  });
});
</script>

</body>
</html>
